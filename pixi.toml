# 32_30_robot_framework pixi envs (managed by ./robot-box, see README.md). conda-forge + PyPI, pinned by
# pixi.lock; env in ./.pixi, package caches in ./cache. Robot Framework and the libraries used by the
# embedded tests here; Renode itself (32_06_renode) and Zephyr (32_03_zephyr) are reached, not copied.
[workspace]
name = "robot_box"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
pip = "*"

[pypi-dependencies]
# core + parallel runner + linter/formatter
robotframework = "==7.5"
robotframework-pabot = "==5.2.2"
robotframework-robocop = "==9.1.2"
robotframework-retryfailed = "==0.2.0"
# hardware and targets: UART (SerialLibrary), embedded Linux over SSH, consoles of qemu/processes (pexpect)
robotframework-seriallibrary = "==0.4.3"
robotframework-sshlibrary = "==3.8.0"
pyserial = "==3.5"
pexpect = "==4.9.0"

# `./robot-box renode` (Renode's renode-test) runs in its own env: Renode 1.17's listeners (retry/timeout,
# output formatter) need Robot Framework 6.1, the version in renode/tests/requirements.txt; with 7.x they
# are dropped with errors. Same keyword libraries otherwise.
[feature.renode.dependencies]
python = "3.12.*"

[feature.renode.pypi-dependencies]
robotframework = "==6.1"
robotframework-retryfailed = "==0.2.0"
psutil = "==5.9.4"
pyyaml = "==6.0.*"
telnetlib3 = "==2.0.*"
construct = "==2.10.68"
pyelftools = "==0.30"
pyserial = "==3.5"
pexpect = "==4.9.0"

[environments]
renode = { features = ["renode"], no-default-feature = true }
